# .github/workflows/cmake-single-platform.yml
name: CMake (Clang, C++26)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  # GitHub runners reinstall toolchains under changing file mtimes. Hashing
  # compiler contents and normalizing the checkout directory makes ccache
  # reusable across runs while still invalidating on a real compiler change.
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 2G
  CCACHE_NOHASHDIR: "true"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
        include:
          - os: ubuntu-26.04
            artifact-name: linux-binaries
            binary-suffix: ""
            archive-name: neuralnet-linux-x64.7z
          - os: windows-latest
            artifact-name: windows-binaries
            binary-suffix: ".exe"
            archive-name: neuralnet-windows-x64.7z

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # 注意：不缓存整个 build 目录——旧 CMakeCache.txt 会跨运行携带已移除的
    # -D 设置（如历史上的 CMAKE_CXX_FLAGS=-stdlib=libc++），导致编译/链接
    # 标准库 ABI 不匹配（std::__cxx11::* 未定义）。编译产物由 ccache 缓存。

    # ========== Linux: 安装 LLVM Clang + Ninja ==========
    - name: Install Clang & Ninja (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh all
        sudo ln -sf $(ls /usr/bin/clang-[0-9]* | sort -V | tail -n1) /usr/bin/clang
        sudo ln -sf $(ls /usr/bin/clang++-[0-9]* | sort -V | tail -n1) /usr/bin/clang++
        # 不安装/不指定 libc++：标准库一律使用编译器默认（Linux clang/gcc 默认
        # libstdc++）。若编译与链接两侧标准库不一致，链接期会出现大量 std 符号
        # ABI 不匹配（std::__cxx11::* 未定义）。
        # ccache：缓存编译产物，加速跨运行增量构建
        sudo apt-get install -y ninja-build p7zip-full ccache

    # ========== Linux: 缓存 Vulkan SDK（避免每次下载 300MB+ tar 包）==========
    - name: Cache Vulkan SDK (Linux)
      id: cache-vulkan-linux
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/vulkan-sdk
        key: vulkan-sdk-linux-1.4.357.1

    # 命中缓存：直接复用已解压的 SDK，仅设置环境变量
    - name: Setup Vulkan SDK env (Linux, cached)
      if: runner.os == 'Linux' && steps.cache-vulkan-linux.outputs.cache-hit == 'true'
      run: |
        SDK_DIR="${{ runner.tool_cache }}/vulkan-sdk"
        echo "VULKAN_SDK=$SDK_DIR" >> "$GITHUB_ENV"
        echo "$SDK_DIR/bin" >> "$GITHUB_PATH"
        # LunarG Linux SDK 把 loader 放在 lib/VulkanLoader/lib（不在 lib/），而
        # CMake FindVulkan 只搜 lib/。SDK 自带 setup-env.sh 的关键就是设
        # CMAKE_PREFIX_PATH=$VULKAN_SDK/lib/VulkanLoader；不设它 find_package(Vulkan)
        # 永远失败 → CI 从不编译 GPU（仅纯 CPU 构建）。
        echo "CMAKE_PREFIX_PATH=$SDK_DIR/lib/VulkanLoader:$SDK_DIR" >> "$GITHUB_ENV"
        "$SDK_DIR/bin/glslc" --version

    # 未命中：下载官方 tar 包并解压到固定缓存目录（保证后续路径稳定）
    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux' && steps.cache-vulkan-linux.outputs.cache-hit != 'true'
      run: |
        # Ubuntu 26.04 (resolute) 的 LunarG apt 仓库不存在（404），改用官方 tar.xz。
        # 解压后为 1.x.yy.z/x86_64，内含 bin(含 glslc)/include/lib。
        # 注：Linux 无 "latest" 下载端点（404），固定用官方版本号 URL（LunarG 保留旧版本）。
        cd "$HOME"
        curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
          -o vulkansdk.tar.xz \
          "https://sdk.lunarg.com/sdk/download/1.4.357.1/linux/vulkansdk-linux-x86_64-1.4.357.1.tar.xz"
        tar xf vulkansdk.tar.xz
        SDK_SRC="$(ls -d "$HOME"/1.*/x86_64 2>/dev/null | head -n1)"
        if [ -z "$SDK_SRC" ]; then echo "SDK extract dir not found"; exit 1; fi
        # 拷到固定缓存目录，保证命中后 VULKAN_SDK 路径稳定
        SDK_DIR="${{ runner.tool_cache }}/vulkan-sdk"
        mkdir -p "$SDK_DIR"
        cp -a "$SDK_SRC/." "$SDK_DIR/"
        # 供后续步骤使用：find_package(Vulkan) 读 VULKAN_SDK，PATH 找到 glslc。
        # CMAKE_PREFIX_PATH 必须含 lib/VulkanLoader —— loader 实际位置（见 SDK 的
        # setup-env.sh），否则 CMake 找不到 libvulkan.so，GPU 编译被静默跳过。
        echo "VULKAN_SDK=$SDK_DIR" >> "$GITHUB_ENV"
        echo "$SDK_DIR/bin" >> "$GITHUB_PATH"
        echo "CMAKE_PREFIX_PATH=$SDK_DIR/lib/VulkanLoader:$SDK_DIR" >> "$GITHUB_ENV"
        "$SDK_DIR/bin/glslc" --version

    # ========== Windows: 安装 LLVM Clang + Ninja ==========
    - name: Install Clang & Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm --yes --no-progress
        choco install ninja --yes --no-progress
        choco install 7zip --yes --no-progress
        # ccache：缓存编译产物，加速跨运行增量构建
        choco install ccache --yes --no-progress
        # 将 LLVM 的 bin 目录加入 PATH
        $llvmPath = "C:\Program Files\LLVM\bin"
        echo "$llvmPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 两边工具链安装完成后统一挂载 ccache。由 action 自己管理平台的默认
    # CCACHE_DIR、restore/save 与统计，避免手写 runner 路径漂移。
    - name: Mount ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-v2-release-clang
        restore-keys: |
          ${{ runner.os }}-ccache-v2-
          ${{ runner.os }}-ccache-
        max-size: 2G
        verbose: 1

    - name: Inspect ccache mount
      run: |
        ccache --show-stats --verbose
        ccache --zero-stats

    # ========== Windows: 缓存 Vulkan SDK（避免重复下载安装） ==========
    - name: Cache Vulkan SDK (Windows)
      id: cache-vulkan-windows
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK
        key: vulkan-sdk-windows-latest

    # 命中缓存：直接复用已安装的 SDK，仅设置环境变量
    - name: Setup Vulkan SDK env (Windows, cached)
      if: runner.os == 'Windows' && steps.cache-vulkan-windows.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
        if (-not $sdkDir) { throw "Vulkan SDK cache empty under C:\VulkanSDK" }
        "VULKAN_SDK=$($sdkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$($sdkDir.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 未命中：LunarG 官方无人值守安装
    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows' && steps.cache-vulkan-windows.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $exe = "$env:TEMP\vulkan_sdk.exe"
        # 用 curl.exe 下载（Invoke-WebRequest 对大文件易超时被取消），带重试；
        # --fail 让 HTTP 错误码直接失败，避免写入错误页
        curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors -o $exe "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
        if (-not (Test-Path $exe)) { throw "Vulkan SDK download failed" }
        # 官方无人值守安装（新版安装器废弃了旧的 /S 参数）
        Start-Process -FilePath $exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
        # 定位已安装的 Vulkan SDK 目录（安装器把 VULKAN_SDK 设为 C:\VulkanSDK\<version>，
        # 但当前进程看不到更新的环境变量，需显式写出供后续步骤使用）
        $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
        if (-not $sdkDir) { throw "Vulkan SDK not found under C:\VulkanSDK" }
        # 设置 VULKAN_SDK 供 find_package(Vulkan) 使用，并将 Bin 加入 PATH（含 glslc）
        "VULKAN_SDK=$($sdkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$($sdkDir.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ========== CMake 配置（分平台，因为 bash/pwsh 换行语法不同）==========
    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B ${{github.workspace}}/build \
          -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DNN_ENABLE_NATIVE=OFF \
          -DNN_ENABLE_TESTS=ON
      env:
        CC: clang
        CXX: clang++

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B ${{github.workspace}}/build `
          -G Ninja `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
          -DCMAKE_C_COMPILER_LAUNCHER=ccache `
          -DNN_ENABLE_NATIVE=OFF `
          -DNN_ENABLE_TESTS=ON
      env:
        CC: clang
        CXX: clang++

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Report ccache usage
      run: ccache --show-stats --verbose

    # ========== 真跑测试（roadmap P0-1）==========
    # 需 Vulkan 的用例在无 GPU 的 runner 上按退出码 77 记 skip（非失败）。
    - name: Test ctest (Linux)
      if: runner.os == 'Linux'
      run: ctest --test-dir ${{github.workspace}}/build --output-on-failure

    - name: Test ctest (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ctest --test-dir ${{github.workspace}}/build --output-on-failure

    # 注：v3 生命周期起删除"绑定调试开关"第二轮 ctest —— 设备域检查已从
    # "库外豁免 + 调试开关"升级为**默认入口检查**（每个操作数必须属于本引擎域），
    # 不再需要补丁式第二轮门禁。见 docs/internal/28-lifecycle-v3.md §4.3。

    # 将编译产物打包为 7z
    - name: Package binaries (Linux)
      if: runner.os == 'Linux'
      run: |
        7z a ${{github.workspace}}/build/${{ matrix.archive-name }} \
          ${{github.workspace}}/build/mnist_train \
          ${{github.workspace}}/build/mnist_infer \
          ${{github.workspace}}/build/text_train \
          ${{github.workspace}}/build/text_infer \
          ${{github.workspace}}/build/tokenizer_train \
          ${{github.workspace}}/build/tokenizer_infer \
          ${{github.workspace}}/build/dataset_gen \
          ${{github.workspace}}/build/dataset_convert

    - name: Package binaries (Windows)
      if: runner.os == 'Windows'
      run: |
        7z a ${{github.workspace}}/build/${{ matrix.archive-name }} `
          ${{github.workspace}}/build/mnist_train.exe `
          ${{github.workspace}}/build/mnist_infer.exe `
          ${{github.workspace}}/build/text_train.exe `
          ${{github.workspace}}/build/text_infer.exe `
          ${{github.workspace}}/build/tokenizer_train.exe `
          ${{github.workspace}}/build/tokenizer_infer.exe `
          ${{github.workspace}}/build/dataset_gen.exe `
          ${{github.workspace}}/build/dataset_convert.exe

    # 将 7z 包上传为 artifact，供 release job 使用
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{github.workspace}}/build/${{ matrix.archive-name }}
        retention-days: 1

  # ══════════════════════════════════════════════════════════════════════
  # P1-5：MSVC Debug 冒烟
  # ══════════════════════════════════════════════════════════════════════
  # 上面的 build 矩阵用 clang++ Release，覆盖不到：
  #   ① cl.exe 的 Debug 代码生成 / STL 断言 / 迭代器调试；
  #   ② 只在 Debug 下暴露的未初始化读、迭代器失效、assert 路径。
  # 这里用 Visual Studio 2026 生成器直接拿到 cl.exe（无需 vcvars 脚本），
  # 纯 CPU（NN_ENABLE_GPU=OFF）以避开 Vulkan/glslc 变量，保持冒烟稳定；
  # ctest 除一个已知不稳定数值问题外全跑（见下）；其中 optimizer_test
  # 的 [4] 段断言 8 步训练参数确实移动。
  msvc-debug:
    name: MSVC Debug smoke (cl.exe, CPU-only)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake (MSVC Debug, CPU-only)
      shell: pwsh
      run: >
        cmake -B build-msvc-debug
        -G "Visual Studio 18 2026" -A x64
        -DNN_ENABLE_NATIVE=OFF
        -DNN_ENABLE_GPU=OFF
        -DNN_ENABLE_TESTS=ON

    - name: Build (Debug)
      shell: pwsh
      run: cmake --build build-msvc-debug --config Debug --parallel

    # ⚠ rapt_test_f16 是已知的 RAPT f16 NaN（18 §3.1 C11）：用户已排查，怀疑是
    #   设备/后端自身问题；Release 下不触发只是概率，不是"Debug 专有"。
    #   修好前显式排除；其余用例全跑，避免这个已知不稳定项把 Debug job 永久染红。
    - name: Test ctest (Debug)
      shell: pwsh
      run: >
        ctest --test-dir build-msvc-debug -C Debug --output-on-failure
        -E "^rapt_test_f16$"

  # ══════════════════════════════════════════════════════════════════════
  # 文档 / 双仓一致性（不编译；engine 子模块经 https 重写拉取）
  #   · check_header_sync.py：主仓 include/neuralnet.cpp ↔ engine/engine/include
  #     的层/模型头副本必须逐字一致（防双仓漂移）；
  #   · check_env_vars.py：环境变量"代码读取点 ↔ AGENTS/docs"三方对照（死变量门禁）；
  #   · doc_audit.py：文档↔代码对齐审计（含 [E2] AGENTS internal 索引检查）。
  consistency:
    name: Docs & header-sync consistency
    runs-on: ubuntu-latest

    steps:
    - name: Rewrite submodule URL to https
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Header sync (dual-repo copies)
      run: python3 scripts/check_header_sync.py
    - name: Env var three-way audit
      run: python3 scripts/check_env_vars.py
    - name: doc_audit
      run: python3 scripts/doc_audit.py

  release:
    needs: [build, msvc-debug]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-binaries
        path: artifacts/linux

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-binaries
        path: artifacts/windows

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Nightly Build - ${{ github.sha }}
        tag_name: nightly
        prerelease: true
        body: |
          自动构建版本，commit: ${{ github.sha }}

          ### 构建环境
          - Compiler: Clang（CI 指定 clang++；标准库用编译器默认）
          - C++ Standard: C++26

          | 平台 | 产物 |
          |------|------|
          | 🐧 Linux (Ubuntu Latest) | `neuralnet-linux-x64.7z` |
          | 🪟 Windows (Latest) | `neuralnet-windows-x64.7z` |
        files: |
          artifacts/**/*.7z
